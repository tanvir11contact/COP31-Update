<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 COP Daily Briefing | Climate Intelligence Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06090f;
  --bg2: #0d1117;
  --card: #161b22;
  --card2: #1c2333;
  --border: #21262d;
  --green: #2ea043;
  --green2: #3fb950;
  --blue: #58a6ff;
  --orange: #f0883e;
  --red: #f85149;
  --purple: #bc8cff;
  --yellow: #d29922;
  --cyan: #39d2c0;
  --pink: #f778ba;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.header {
  background: rgba(13, 17, 23, 0.95);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
}
.header-top {
  max-width: 1400px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--green), var(--cyan));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.logo h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  background: linear-gradient(135deg, #fff, var(--green2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo span {
  font-size: 0.65rem;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 2px;
  display: block;
}
.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}
.btn:hover { border-color: var(--green); background: var(--card2); }
.btn-primary {
  background: linear-gradient(135deg, var(--green), #1a7f37);
  border-color: var(--green);
  color: #fff;
}
.btn-gdoc {
  background: linear-gradient(135deg, #1a73e8, #4285f4);
  border-color: #4285f4;
  color: #fff;
}
.live-dot {
  width: 8px; height: 8px;
  background: var(--green2);
  border-radius: 50%;
  animation: pulse 2s infinite;
  display: inline-block;
}
@keyframes pulse {
  0%,100% { opacity:1; transform: scale(1); }
  50% { opacity:0.4; transform: scale(1.2); }
}
.stats-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
}
.stats-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 10px;
}
.stat { text-align: center; }
.stat-num { font-size: 1.2rem; font-weight: 800; color: var(--green2); }
.stat-label { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; }
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}
.loading-overlay {
  text-align: center;
  padding: 60px 20px;
}
.spinner {
  width: 50px; height: 50px;
  border: 3px solid var(--border);
  border-top-color: var(--green2);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 15px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.exec-summary {
  background: linear-gradient(135deg, rgba(46,160,67,0.08), rgba(57,210,192,0.05));
  border: 1px solid rgba(46,160,67,0.2);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
}
.exec-summary h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #fff; margin-bottom: 4px; }
.exec-date { color: var(--green2); font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; display: block; }
.top7 {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
}
.top7 h2 { font-size: 1.2rem; color: var(--orange); margin-bottom: 16px; }
.top7-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.top7-item:last-child { border-bottom: none; }
.top7-num {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--orange), var(--red));
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.8rem; color: #fff; flex-shrink: 0;
}
.top7-content h3 { font-size: 0.9rem; color: var(--text); }
.top7-content h3 a { color: var(--text); text-decoration: none; }
.top7-content h3 a:hover { color: var(--blue); }
.top7-source { background: rgba(88,166,255,0.1); color: var(--blue); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
.sectors-header { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 30px 0 16px; color: #fff; }
.sectors-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.sector-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.sector-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.sector-bullets { list-style: none; }
.sector-bullets li { padding: 6px 0; border-bottom: 1px solid rgba(33,38,45,0.4); font-size: 0.82rem; display: flex; gap: 8px; }
.sector-bullets li:last-child { border-bottom: none; }
.footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 30px 24px; text-align: center; font-size: 0.8rem; color: var(--text2); }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">🌍</div>
      <div>
        <h1>COP Daily Briefing</h1>
        <span>Climate Intelligence Hub</span>
      </div>
    </div>
    <div class="header-actions">
      <span class="btn" style="cursor:default;"><span class="live-dot"></span> Live</span>
      <button class="btn btn-primary" onclick="loadNews(true)">🔄 Refresh</button>
      <a class="btn btn-gdoc" id="gdoc-link" href="https://docs.google.com/document/d/1hDenpnK2c266D4S5VOoVRyoeWmjZMcjP6iXSV_hw5vY/edit?usp=sharing" target="_blank">📄 Google Doc</a>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-inner">
    <div class="stat"><div class="stat-num" id="stat-articles">--</div><div class="stat-label">Articles</div></div>
    <div class="stat"><div class="stat-num">10</div><div class="stat-label">Sources</div></div>
    <div class="stat"><div class="stat-num" id="stat-sectors">--</div><div class="stat-label">Sectors</div></div>
    <div class="stat"><div class="stat-num" id="stat-time">--</div><div class="stat-label">Updated</div></div>
  </div>
</div>

<main class="main">
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <h2>Loading Climate Intelligence...</h2>
    <p style="color:var(--text2); font-size:0.85rem;">Fetching fast RSS feeds</p>
  </div>
  <div id="content" style="display:none;"></div>
</main>

<footer class="footer">
  <p>© 2025 Bridge CET | COP Daily Briefing | Updated Automatically</p>
</footer>

<script>
const RSS_FEEDS = [
  { name: "The Guardian", url: "https://www.theguardian.com/environment/rss" },
  { name: "BBC News", url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml" },
  { name: "Carbon Brief", url: "https://www.carbonbrief.org/feed/" },
  { name: "UNEP", url: "https://www.unep.org/rss.xml" },
  { name: "Climate Change News", url: "https://www.climatechangenews.com/feed/" }
];

const SECTOR_KEYWORDS = {
  "⚡ Energy": ["energy","solar","wind","coal","oil","gas","power","renewable"],
  "💰 Finance": ["finance","funding","bank","investment","money","dollar","market"],
  "🛡️ Adaptation": ["adaptation","flood","drought","storm","resilience","climate"],
  "📜 Policy & COP": ["policy","cop","un","agreement","negotiation","summit","ndc"],
  "🌳 Nature & Forest": ["forest","nature","biodiversity","land","tree","amazon"]
};

// ULTRA FAST RSS-TO-JSON FETCHING
async function fetchFeed(feed) {
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
  try {
    const res = await fetch(apiUrl, { signal: AbortSignal.timeout(4000) });
    if (res.ok) {
      const data = await res.json();
      if (data.status === 'ok' && data.items) {
        return data.items.map(item => ({
          title: item.title,
          link: item.link,
          pubDate: item.pubDate,
          source: feed.name,
          sector: detectSector(item.title)
        }));
      }
    }
  } catch(e) {}
  return [];
}

function detectSector(title) {
  const t = title.toLowerCase();
  for (const [sector, keywords] of Object.entries(SECTOR_KEYWORDS)) {
    if (keywords.some(kw => t.includes(kw))) return sector;
  }
  return "📜 Policy & COP";
}

async function loadNews(forceRefresh = false) {
  const loading = document.getElementById("loading");
  const content = document.getElementById("content");

  // CACHE FIRST Strategy for Instant Display (0 Sec)
  const cached = localStorage.getItem("cop_news_data");
  const cacheTime = localStorage.getItem("cop_news_time");
  
  if (!forceRefresh && cached && cacheTime && (Date.now() - cacheTime < 30 * 60 * 1000)) {
    renderUI(JSON.parse(cached));
    loading.style.display = "none";
    content.style.display = "block";
    return;
  }

  loading.style.display = "block";

  // Parallel Fetching
  const results = await Promise.all(RSS_FEEDS.map(fetchFeed));
  let articles = results.flat();

  if (articles.length === 0) {
    articles = getBackupArticles();
  }

  // Deduplicate & Save Cache
  articles = articles.filter((v,i,a)=>a.findIndex(v2=>(v2.title===v.title))===i);
  localStorage.setItem("cop_news_data", JSON.stringify(articles));
  localStorage.setItem("cop_news_time", Date.now().toString());

  renderUI(articles);
  loading.style.display = "none";
  content.style.display = "block";
}

function renderUI(articles) {
  const content = document.getElementById("content");
  const top7 = articles.slice(0, 7);
  
  const bySector = {};
  articles.forEach(a => {
    if (!bySector[a.sector]) bySector[a.sector] = [];
    bySector[a.sector].push(a);
  });

  let html = `
    <div class="exec-summary">
      <h2>🌍 COP Daily Executive Summary</h2>
      <span class="exec-date">📅 ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</span>
      <p>Today's briefing consolidates key developments from <strong>${articles.length} news items</strong> across global climate negotiations, energy transitions, and finance frameworks.</p>
    </div>

    <div class="top7">
      <h2>🔝 Top 7 Headlines</h2>
  `;

  top7.forEach((item, i) => {
    html += `
      <div class="top7-item">
        <div class="top7-num">${i+1}</div>
        <div class="top7-content">
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <div><span class="top7-source">${item.source}</span></div>
        </div>
      </div>
    `;
  });

  html += `</div><h2 class="sectors-header">📊 Sector Breakdown</h2><div class="sectors-grid">`;

  for (const [sector, items] of Object.entries(bySector)) {
    html += `
      <div class="sector-card">
        <div class="sector-header"><h3>${sector}</h3></div>
        <ul class="sector-bullets">
    `;
    items.slice(0, 5).forEach((art, idx) => {
      html += `
        <li>
          <strong style="color:var(--text3)">${idx+1}.</strong>
          <a href="${art.link}" target="_blank" style="color:var(--text);text-decoration:none;">${art.title}</a>
        </li>
      `;
    });
    html += `</ul></div>`;
  }

  html += `</div>`;
  content.innerHTML = html;

  document.getElementById("stat-articles").textContent = articles.length;
  document.getElementById("stat-sectors").textContent = Object.keys(bySector).length;
  document.getElementById("stat-time").textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function getBackupArticles() {
  return [
    { title: "COP31 Preparations Intensify as Nations Draft New Pledges", link: "#", source: "UNFCCC", sector: "📜 Policy & COP" },
    { title: "Global Renewable Energy Investment Reaches Record High", link: "#", source: "Carbon Brief", sector: "⚡ Energy" },
    { title: "Developing Countries Urge Fast-Tracking of Loss and Damage Funds", link: "#", source: "Reuters", sector: "💰 Finance" },
    { title: "Amazon Deforestation Drops Significantly Under New Policies", link: "#", source: "The Guardian", sector: "🌳 Nature & Forest" }
  ];
}

// Start immediately
loadNews();
</script>
</body>
</html>
